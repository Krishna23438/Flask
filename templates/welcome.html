<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Page</title>
</head>
<body>
  {{ header | safe }}
  <h1>Welcome back {{ name }}!</h1>

  {% if name %}
    <h1>Hello {{name}}</h1>
  {% else %}
    <h1>Hello, World</h1>
  {% endif %}
  
  <ol>
    {% for freind in freinds %}
      <li>{{ freind }}</li>
    {% endfor %}
  </ol>

</body>
</html>
